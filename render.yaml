services:
  - type: web
    name: the-commonplace
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: FANART_TV_API_KEY
        sync: false
      - key: LASTFM_API_KEY
        sync: false
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: APP_CONTACT
        sync: false
      - key: APP_BASE_URL
        value: "https://the-commonplace.onrender.com"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_PERSONALIZED_HOME_FEED
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
